packages:
  - 'apps/*'
  - 'libs/*'
  - 'packages/*'

allowBuilds:
  '@swc/core': true
  nx: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  '@parcel/watcher': true
  msgpackr-extract: true
  protobufjs: false

# Security overrides for transitive dependencies whose parents pin vulnerable
# versions. Each one only lifts the vulnerable range to the nearest patched
# release in the same major line. Remove an entry once its parent ships the fix.
overrides:
  # nx@23.3.0 pins undici 7.29.0 (TLS validation bypass, WebSocket DoS, ...).
  'undici@>=7.0.0 <7.29.1': '^7.29.1'
  # minimatch 10 (via @nx/devkit, @fastify/static) - ReDoS / recursion DoS.
  'brace-expansion@>=5.0.0 <5.0.12': '^5.0.12'
  # http-proxy (via @nx/web dev server) - credential header leak on redirect.
  'follow-redirects@<1.16.1': '^1.16.1'
  # @fastify/rate-limit - quadratic-time IPv6 zone parsing.
  'ip-address@>=10.0.0 <10.7.4': '^10.7.4'
  # drizzle-kit -> deprecated @esbuild-kit/core-utils pins esbuild ~0.18
  # (dev server accepts cross-origin requests). Uses the esbuild drizzle-kit
  # itself already depends on.
  '@esbuild-kit/core-utils>esbuild': '^0.25.12'
