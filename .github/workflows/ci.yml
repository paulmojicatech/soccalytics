name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4
      # Only lint/test/build what the change affects.
      - run: pnpm nx affected -t lint typecheck test build --exclude=vision-worker
      # Offline evals guard prompt/grounding regressions without spending tokens.
      - run: pnpm nx run ai:eval

  vision-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vision-worker
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run ruff check . && uv run pytest -q
