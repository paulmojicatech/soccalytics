[project]
name = "soccalytics-vision-worker"
version = "0.1.0"
description = "Soccalytics computer-vision worker: video -> player/ball tracking document (YOLO + ByteTrack + homography)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "bullmq>=3.0",
  "redis>=5.0",
  "boto3>=1.34",
  "ultralytics>=8.3",
  "supervision>=0.25",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
vision-worker = "vision_worker.main:run"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_worker"]

# uv: `uv sync --extra dev` creates .venv from this file.
[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = [
  "PLR0913", # pipeline wiring takes several injected collaborators by design
  "PLR2004", # magic numbers are fine for CV thresholds documented inline
  "N815",    # camelCase fields mirror the TypeScript contracts verbatim
  "PLC0415", # heavy deps (torch/ultralytics/supervision/boto3) are imported lazily on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "N806"]
